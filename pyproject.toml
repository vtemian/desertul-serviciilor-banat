[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "desertul-serviciilor-banat"
version = "0.0.1"
description = "Civic-data map of public-service access across Timiș county UATs."
requires-python = ">=3.11,<3.12"
dependencies = [
  "geopandas==0.14.4",
  "shapely==2.0.3",
  "pandas==2.1.4",
  "pyproj==3.6.1",
  "requests==2.31.0",
  "beautifulsoup4==4.12.2",
  "pdfplumber==0.10.3",
  "openpyxl==3.1.2",
  "osm2geojson==0.2.5",
  "playwright==1.40.0",
  "xlrd==2.0.1",
]

[project.optional-dependencies]
dev = ["pytest==7.4.4", "ruff==0.4.4"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-ra -q"
